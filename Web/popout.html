<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RoomPing Pro Screen Flash</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }
        .screen-flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }
        .screen-flash::before {
            content: "";
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border: 96px solid rgba(255, 255, 255, 0);
            opacity: 0;
        }
        .screen-flash.active::before {
            animation: border-flash 0.35s ease-in-out 4;
        }
        @keyframes border-flash {
            0%, 100% { border-color: rgba(255, 255, 255, 0); opacity: 0; }
            50% { border-color: rgba(255, 255, 255, 0.95); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="screen-flash" id="screen-flash"></div>

    <script>
        let hideTimer = null;
        function flashBorder() {
            const overlay = document.getElementById('screen-flash');
            overlay.classList.remove('active');
            void overlay.offsetWidth;
            overlay.classList.add('active');
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
                overlay.classList.remove('active');
                if (window.pywebview?.api?.set_alerts_visible) {
                    window.pywebview.api.set_alerts_visible(false);
                }
            }, 1800);
        }
        window.showPing = flashBorder;
        window.showMessageFlash = flashBorder;
    </script>
</body>
</html>
